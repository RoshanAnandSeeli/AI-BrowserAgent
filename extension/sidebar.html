<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AI Powered Browsing Agent</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main class="panel">
			<header class="header">
				<div class="brand"><span class="mark">✦</span><div><span class="eyebrow">Browser agent</span><h1>AI Powered Browsing Agent</h1></div></div>
				<div class="header-actions"><button id="pin" class="icon-button" type="button" title="Sidebar is open" aria-label="Sidebar is open">▣</button><span class="live"><i></i> ready</span></div>
			</header>
			<section class="page-card"><span class="eyebrow">Current page</span><strong id="page-title">Reading page...</strong><span id="page-url"></span></section>
			<label class="eyebrow" for="request">What should I do?</label>
			<textarea id="request" rows="5" placeholder="Summarize this page, find the pricing, or explain what I am looking at..."></textarea>
			<div class="actions"><button id="summarise" class="secondary" type="button">Summarise</button><button id="execute" class="primary" type="button"><span>✦</span> Execute</button></div>
			<p id="status" class="status" role="status">Fast mode uses local browser tasks and compact page context.</p>
			<section id="agent-progress" class="agent-progress" hidden>
				<div class="eyebrow">Active goal</div><p id="agent-goal" class="agent-goal"></p>
				<div class="action-label">Plan and progress</div><ol id="agent-plan" class="agent-plan"></ol>
				<p id="agent-current-step" class="agent-current-step"></p>
				<div class="agent-controls">
					<button id="resume-agent" class="secondary" type="button" hidden>Resume Agent</button>
					<button id="confirm-agent" class="primary" type="button" hidden>Confirm action</button>
					<button id="stop-agent" class="secondary" type="button" hidden>Stop Agent</button>
				</div>
			</section>
			<section id="result" class="result" hidden><div class="result-heading"><div class="eyebrow">Agent response</div><button id="copy" class="copy-button" type="button">Copy</button></div><p id="answer"></p><div id="action-wrap" hidden><div class="action-label">Executed action</div><code id="action"></code></div></section>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
